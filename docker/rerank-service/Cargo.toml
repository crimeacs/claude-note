[package]
name = "rerank-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rerank-service"
path = "src/main.rs"

[[bin]]
name = "healthcheck"
path = "src/healthcheck.rs"

[dependencies]
fastembed = "5"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
